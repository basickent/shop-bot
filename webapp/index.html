<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --bg2: var(--tg-theme-secondary-bg-color, #f4f4f4);
    --fg: var(--tg-theme-text-color, #000);
    --hint: var(--tg-theme-hint-color, #999);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-fg: var(--tg-theme-button-text-color, #fff);
    --link: var(--tg-theme-link-color, #2481cc);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
    padding-bottom: 88px;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); padding: 8px 12px;
    border-bottom: 1px solid rgba(127,127,127,.12);
  }
  #search {
    width: 100%; padding: 10px 14px; font-size: 16px;
    border-radius: 10px; border: 1px solid rgba(127,127,127,.2);
    background: var(--bg2); color: var(--fg); outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #status { padding: 12px; text-align: center; color: var(--hint); font-size: 14px; }
  #products {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; padding: 10px 12px;
  }
  @media (min-width: 480px) { #products { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 720px) { #products { grid-template-columns: repeat(4, 1fr); } }
  .product {
    background: var(--bg2); border-radius: 12px;
    overflow: hidden; display: flex; flex-direction: column;
    position: relative;
  }
  .img-wrap {
    aspect-ratio: 1/1; background: rgba(127,127,127,.1);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .img-wrap.empty::after { content: "📦"; font-size: 32px; opacity: .4; }
  .info { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name {
    font-size: 13px; line-height: 1.3; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .price { font-weight: 700; font-size: 15px; color: var(--link); margin-top: auto; }
  .add {
    position: absolute; right: 8px; bottom: 8px;
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: var(--accent); color: var(--accent-fg);
    font-size: 22px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .add:active { transform: scale(.92); }
  #load-more { text-align: center; padding: 16px; }
  #load-more-btn {
    padding: 10px 24px; border-radius: 10px;
    border: 1px solid var(--accent); background: transparent;
    color: var(--accent); font-size: 15px; font-weight: 500;
  }
  .cart-bar {
    position: fixed; left: 10px; right: 10px; bottom: 10px;
    background: var(--accent); color: var(--accent-fg);
    border-radius: 14px; padding: 12px 16px;
    display: none; align-items: center; justify-content: space-between;
    box-shadow: 0 6px 24px rgba(0,0,0,.2);
    z-index: 20;
  }
  .cart-bar.visible { display: flex; }
  .cart-bar-info { display: flex; flex-direction: column; gap: 2px; }
  .cart-bar-count { font-size: 12px; opacity: .85; }
  .cart-bar-total { font-size: 17px; font-weight: 700; }
  #open-cart {
    padding: 10px 20px; border-radius: 10px; border: none;
    background: #fff; color: var(--accent); font-size: 15px; font-weight: 600;
    cursor: pointer;
  }
  .modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.5);
    display: none; align-items: flex-end;
  }
  .modal.open { display: flex; }
  .modal-body {
    background: var(--bg); width: 100%;
    border-radius: 16px 16px 0 0;
    max-height: 90vh; overflow-y: auto;
    padding: 16px 16px 24px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .modal-body h3 { margin: 0 0 4px; font-size: 18px; }
  .cart-item {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px; border-radius: 10px; background: var(--bg2);
  }
  .ci-name { font-size: 14px; line-height: 1.3; }
  .ci-controls {
    display: flex; align-items: center; gap: 8px;
  }
  .qty-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid rgba(127,127,127,.25); background: var(--bg);
    color: var(--fg); font-size: 18px; line-height: 1;
    cursor: pointer;
  }
  .qty { min-width: 24px; text-align: center; font-weight: 600; }
  .ci-sum { margin-left: auto; font-weight: 700; color: var(--link); }
  .muted { color: var(--hint); font-size: 14px; padding: 8px 0; }
  .field-group { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .modal-body input, .modal-body textarea {
    width: 100%; padding: 12px 14px; font-size: 16px;
    border-radius: 10px; border: 1px solid rgba(127,127,127,.2);
    background: var(--bg2); color: var(--fg); font-family: inherit;
    resize: vertical; outline: none;
  }
  .modal-body input:focus, .modal-body textarea:focus { border-color: var(--accent); }
  #checkout {
    margin-top: 8px; padding: 14px;
    border: none; border-radius: 12px;
    background: var(--accent); color: var(--accent-fg);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  #checkout:active { transform: scale(.98); }
  .secondary {
    padding: 12px; border: none; border-radius: 12px;
    background: transparent; color: var(--hint); font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <input id="search" placeholder="🔍 Поиск по названию" autocomplete="off" autocorrect="off">
</header>

<div id="status">Загрузка каталога…</div>
<main id="products"></main>
<div id="load-more" style="display:none">
  <button id="load-more-btn">Показать ещё</button>
</div>

<div class="cart-bar" id="cart-bar">
  <div class="cart-bar-info">
    <span class="cart-bar-count" id="cart-count">0 шт</span>
    <span class="cart-bar-total" id="cart-total">0 ₽</span>
  </div>
  <button id="open-cart">Корзина</button>
</div>

<div class="modal" id="cart-modal">
  <div class="modal-body">
    <h3>Корзина</h3>
    <div id="cart-items"><div class="muted">Пусто</div></div>
    <div class="field-group">
      <input id="name" placeholder="Ваше имя *" required>
      <input id="phone" type="tel" placeholder="Телефон *" required>
      <input id="address" placeholder="Адрес доставки">
      <textarea id="comment" placeholder="Комментарий к заказу" rows="2"></textarea>
    </div>
    <button id="checkout">Отправить заказ</button>
    <button id="close-cart" class="secondary">Закрыть</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor('secondary_bg_color'); } catch(e){}
try { tg.setBackgroundColor('bg_color'); } catch(e){}

const state = { products: [], filtered: [], shown: 0, pageSize: 60, cart: {} };

const fmt = n => (Math.round(Number(n) * 100) / 100).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  try {
    const r = await fetch('catalog.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    state.products = data.products || [];
    state.filtered = state.products;
    document.getElementById('status').style.display = 'none';
    render(true);
  } catch (e) {
    document.getElementById('status').textContent = 'Ошибка загрузки: ' + e.message;
  }
}

function render(reset) {
  const box = document.getElementById('products');
  if (reset) { box.innerHTML = ''; state.shown = 0; }
  const slice = state.filtered.slice(state.shown, state.shown + state.pageSize);
  if (!slice.length && state.shown === 0) {
    box.innerHTML = '<div id="status">Ничего не найдено</div>';
    document.getElementById('load-more').style.display = 'none';
    return;
  }
  box.insertAdjacentHTML('beforeend', slice.map(p => `
    <div class="product">
      <div class="img-wrap ${p.image_url ? '' : 'empty'}">
        ${p.image_url ? `<img src="${esc(p.image_url)}" loading="lazy" onerror="this.parentNode.classList.add('empty');this.remove();">` : ''}
      </div>
      <div class="info">
        <div class="name">${esc(p.name)}</div>
        <div class="price">${fmt(p.price)}</div>
      </div>
      <button class="add" data-id="${esc(p.id)}" aria-label="Добавить">+</button>
    </div>
  `).join(''));
  state.shown += slice.length;
  document.getElementById('load-more').style.display = state.shown < state.filtered.length ? 'block' : 'none';
}

function addToCart(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  if (!state.cart[id]) state.cart[id] = { product: p, quantity: 0 };
  state.cart[id].quantity++;
  updateCartBar();
  try { tg.HapticFeedback.impactOccurred('light'); } catch(e){}
}

function updateCartBar() {
  const items = Object.values(state.cart).filter(i => i.quantity > 0);
  const total = items.reduce((s, i) => s + i.product.price * i.quantity, 0);
  const count = items.reduce((s, i) => s + i.quantity, 0);
  document.getElementById('cart-count').textContent = count + ' шт';
  document.getElementById('cart-total').textContent = fmt(total);
  document.getElementById('cart-bar').classList.toggle('visible', count > 0);
}

function openCart() {
  renderCartItems();
  document.getElementById('cart-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeCart() {
  document.getElementById('cart-modal').classList.remove('open');
  document.body.style.overflow = '';
}

function renderCartItems() {
  const box = document.getElementById('cart-items');
  const items = Object.values(state.cart).filter(i => i.quantity > 0);
  if (!items.length) { box.innerHTML = '<div class="muted">Корзина пуста</div>'; return; }
  box.innerHTML = items.map(i => `
    <div class="cart-item" data-id="${esc(i.product.id)}">
      <div class="ci-name">${esc(i.product.name)}</div>
      <div class="ci-controls">
        <button class="qty-btn" data-action="dec">−</button>
        <span class="qty">${i.quantity}</span>
        <button class="qty-btn" data-action="inc">+</button>
        <span class="ci-sum">${fmt(i.product.price * i.quantity)}</span>
      </div>
    </div>
  `).join('');
}

function changeQty(id, delta) {
  const it = state.cart[id];
  if (!it) return;
  it.quantity += delta;
  if (it.quantity <= 0) delete state.cart[id];
  renderCartItems();
  updateCartBar();
  if (!Object.keys(state.cart).length) closeCart();
}

function checkout() {
  const items = Object.values(state.cart).filter(i => i.quantity > 0);
  if (!items.length) { tg.showAlert('Корзина пуста'); return; }
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const comment = document.getElementById('comment').value.trim();
  if (name.length < 2) { tg.showAlert('Укажите имя'); return; }
  if (phone.length < 6) { tg.showAlert('Укажите телефон'); return; }
  const payload = {
    items: items.map(i => ({
      id: i.product.id, name: i.product.name,
      price: Number(i.product.price), quantity: i.quantity
    })),
    customer: { name, phone, address, comment },
  };
  const str = JSON.stringify(payload);
  if (str.length > 4000) { tg.showAlert('Заказ слишком большой, уменьшите корзину'); return; }
  try { tg.HapticFeedback.notificationOccurred('success'); } catch(e){}
  tg.sendData(str);
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  state.filtered = q
    ? state.products.filter(p => p.name.toLowerCase().includes(q))
    : state.products;
  render(true);
  window.scrollTo({ top: 0, behavior: 'instant' });
});

document.getElementById('load-more-btn').addEventListener('click', () => render(false));

document.getElementById('products').addEventListener('click', e => {
  const btn = e.target.closest('button.add');
  if (btn) addToCart(btn.dataset.id);
});

document.getElementById('open-cart').addEventListener('click', openCart);
document.getElementById('close-cart').addEventListener('click', closeCart);

document.getElementById('cart-items').addEventListener('click', e => {
  const btn = e.target.closest('button.qty-btn');
  if (!btn) return;
  const row = btn.closest('.cart-item');
  changeQty(row.dataset.id, btn.dataset.action === 'inc' ? 1 : -1);
});

document.getElementById('checkout').addEventListener('click', checkout);

load();
</script>
</body>
</html>
